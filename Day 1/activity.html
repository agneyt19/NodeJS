 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>map</title>
 </head>
 <body>
    <h1>Check the Browser Console</h1>
    <script>
        let student= new Map()
        student.set("Student name","Agney")
        student.set("Student rollno","19")
        student.set("Student class","btech")
        student.set("Student college","IIT")
        console.log("Name = "+student.get("Student name"))
        console.log("Rollno = "+student.get("Student rollno"))
        console.log("Class = "+student.get("Student class"))
        console.log("College = "+student.get("Student college"))
    </script>
 </body>
 </html>

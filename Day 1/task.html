<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Employee Registration</h1><br>
    <label>Employee Name:</label><br>
    <input type="text" id="name" required><br><br>
    <label >Employee Salary:</label><br>
    <input type="text" id="salary" required>
    <br><br>
    <input type="submit" value="Add Employee" onclick="add()">
    <h2>Employee details</h2>
    <div id="out"></div>
    <div id="pu"></div>
    <script>
       
  const emp = new Map();
 // let total = 0;

  function add() {
    const name = document.getElementById("name").value;
    const salary = Number(document.getElementById("salary").value);

    
    const e = { name: name, salary: salary };

    
    emp.set(e.name, e);
   // total += e.salary;

    const p = document.createElement("p");
    p.innerHTML = e.name + " : " + e.salary;
    document.getElementById("out").appendChild(p);

    //document.getElementById("pu").innerHTML = "Total salary: " + total;

    document.getElementById("name").value = "";
    document.getElementById("salary").value = "";
  }

    </script>
</body>
</html>
